name: CD

on:
  push:
    branches:
      - "main"
      - "release/*"

permissions:
  contents: write   # needed to push updated package.json

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build & Version"
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      lifecycle_stage: ${{ steps.version.outputs.lifecycle_stage }}
      app_service: ${{ steps.version.outputs.app_service }}
      version_updated: ${{ steps.sync_version.outputs.version_updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # Sync package.json version with release branch name (release/*)
      - name: Sync package.json version with branch (release/*)
        id: sync_version
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          UPDATED=false

          # Only enforce sync for release branches
          if [[ "$BRANCH" == release/* ]]; then
            SEMVER_PKG=$(node -p "require('./package.json').version")
            BASE="${BRANCH#release/}"  # strip 'release/'
            BASE="${BASE#v}"           # strip leading 'v' if present

            echo "Release branch detected: $BRANCH"
            echo "package.json version: $SEMVER_PKG"
            echo "Branch base version:  $BASE"

            if [ "$SEMVER_PKG" != "$BASE" ]; then
              echo "Version mismatch – updating package.json to $BASE and pushing to $BRANCH..."

              node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
              pkg.version = '$BASE';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              "

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add package.json
              git commit -m "chore: sync version to $BASE from branch $BRANCH"
              git push origin HEAD:$BRANCH

              UPDATED=true
            else
              echo "Version already matches branch. No update needed."
            fi
          else
            echo "Not a release/* branch. No version sync required."
          fi

          echo "version_updated=$UPDATED" >> $GITHUB_OUTPUT

      - name: Extract version (RC for release/*, final for main)
        id: version
        run: |
          SEMVER=$(node -p "require('./package.json').version")
          BUILD=${GITHUB_RUN_NUMBER}
          BRANCH="${GITHUB_REF_NAME}"

          echo "Detected branch: $BRANCH"
          echo "Semantic version from package.json: $SEMVER"

          # Defaults for main (production)
          ARTIFACT_VERSION="$SEMVER"
          LIFECYCLE_STAGE="production"
          APP_SERVICE="Finance API - Prod"

          # For release branches: release/v0.9.0 -> 0.9.0-rc.<build>
          if [[ "$BRANCH" == release/* ]]; then
            BASE="${BRANCH#release/}"  # strip 'release/'
            BASE="${BASE#v}"           # strip leading 'v' if present
            ARTIFACT_VERSION="${BASE}-rc.${BUILD}"
            LIFECYCLE_STAGE="pre_production"
            APP_SERVICE="Finance API - NonProd"
          fi

          echo "artifact_version=${ARTIFACT_VERSION}" >> $GITHUB_OUTPUT
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "lifecycle_stage=${LIFECYCLE_STAGE}" >> $GITHUB_OUTPUT
          echo "app_service=${APP_SERVICE}" >> $GITHUB_OUTPUT

          echo "Final artifact version: $ARTIFACT_VERSION"
          echo "Lifecycle stage: $LIFECYCLE_STAGE"
          echo "Application service: $APP_SERVICE"


  test:
    runs-on: ubuntu-latest
    name: "Test"
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm test -- --coverage
        env:
          NODE_ENV: test

      - name: ServiceNow DevOps Unit Test Results
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: "Test"
          xml-report-filename: reports/junit/jest-results.xml
          test-summary-name: "TestSummary"


  sbom:
    runs-on: ubuntu-latest
    name: "Upload SBOM to ServiceNow via REST"
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # sync package.json version to SEMVER from build job
      - name: Sync package.json version from SEMVER
        run: |
          echo "SEMVER from build: $SEMVER"
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version = process.env.SEMVER;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated package.json to version $SEMVER"
        env:
          SEMVER: ${{ needs.build.outputs.semver }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate SBOM (CycloneDX)
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          mkdir -p sbom
          cyclonedx-npm --output-file sbom/sbom.json --output-format json

      - name: Upload SBOM to ServiceNow via REST
        env:
          SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
          SN_SBOM_USER: ${{ secrets.SN_SBOM_USER }}
          SN_SBOM_PASSWORD: ${{ secrets.SN_SBOM_PASSWORD }}
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
          LIFECYCLE_STAGE: ${{ needs.build.outputs.lifecycle_stage }}
        run: |
          echo "Uploading SBOM to ServiceNow..."
          if [ ! -f sbom/sbom.json ]; then
            echo "SBOM file sbom/sbom.json not found"
            exit 1
          fi

          URL="${SN_INSTANCE_URL%/}/api/sbom/core/upload"
          URL="${URL}?businessApplicationId=39c42f0483553a10b63977cfeeaad365"
          URL="${URL}&buildId=${ARTIFACT_VERSION}"
          URL="${URL}&requestedBy=devops"
          URL="${URL}&lifecycleStage=${LIFECYCLE_STAGE}"
          URL="${URL}&fetchVulnerabilityInfo=true"
          URL="${URL}&fetchPackageInfo=true"

          echo "Calling SBOM API: $URL"

          HTTP_CODE=$(curl -s -o sbom/response.json -w "%{http_code}" \
            -u "$SN_SBOM_USER:$SN_SBOM_PASSWORD" \
            -H "Content-Type: application/json" \
            -X POST \
            "$URL" \
            --data-binary "@sbom/sbom.json")

          echo "SBOM upload HTTP status: $HTTP_CODE"
          echo "SBOM upload response body:"
          cat sbom/response.json || true

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: SBOM upload failed or was not queued successfully (HTTP $HTTP_CODE). Aborting pipeline."
            exit 1
          fi

          echo "SBOM upload successfully queued for processing."


  analyze:
    runs-on: ubuntu-latest
    name: "SonarQube Analysis"
    needs: [build, sbom]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}

      - name: ServiceNow DevOps Sonar Scan Results
        uses: ServiceNow/servicenow-devops-sonar@v5.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: "SonarQube Analysis"
          sonar-host-url: ${{ secrets.SONAR_URL }}
          sonar-project-key: ${{ secrets.SONAR_PROJECT_KEY }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          command: qualitygate


  registerArtifactPackage:
    runs-on: ubuntu-latest
    name: "Register Artifact and Package"
    needs: [build, analyze]
    steps:
      - name: ServiceNow DevOps Register Artifact
        uses: ServiceNow/servicenow-devops-register-artifact@v5.1.0
        env:
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          job-name: "Register Artifact"
          context-github: ${{ toJSON(github) }}
          artifacts: >-
            [{"name":"com:finance-api",
              "version":"${{ env.ARTIFACT_VERSION }}",
              "semanticVersion":"${{ env.ARTIFACT_VERSION }}",
              "repositoryName":"${{ github.repository }}"}]

      - name: ServiceNow DevOps Register Package
        uses: ServiceNow/servicenow-devops-register-package@v5.1.0
        env:
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: "Register Artifact and Package"
          artifacts: >-
            [{"name":"com:finance-api",
              "version":"${{ env.ARTIFACT_VERSION }}",
              "semanticVersion":"${{ env.ARTIFACT_VERSION }}",
              "repositoryName":"${{ github.repository }}"}]
          package-name: "finance-api-${{ env.ARTIFACT_VERSION }}.pkg"


  changeAndDeploySubProd:
    runs-on: ubuntu-latest
    name: "Create Change & Deployment (Sub-Production)"
    needs: [registerArtifactPackage, build]
    if: ${{ needs.build.outputs.lifecycle_stage == 'pre_production' }}
    steps:
      - name: Create Change in ServiceNow (Sub-Production)
        id: create_change_subprod
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: "Create Change (Sub-Production)"
          change-request-type: "normal"
          short-description: "Deploy Finance API ${{ needs.build.outputs.artifact_version }} to Sub-Production"
          description: "Deployment of Finance API version ${{ needs.build.outputs.artifact_version }} to Sub-Production"
          assignment-group: "DevOps"
          configuration-item: ${{ needs.build.outputs.app_service }}

      - name: Deployment to Sub-Production
        env:
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
          APP_SERVICE: ${{ needs.build.outputs.app_service }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Simulating deployment of Finance API version '$ARTIFACT_VERSION' to SUB-PRODUCTION"
          echo "Target service: $APP_SERVICE"
          echo "Triggered from branch: $BRANCH"
          echo "Change request created in previous step (see ServiceNow)."


  changeAndDeployProd:
    runs-on: ubuntu-latest
    name: "Create Change & Deployment (Production)"
    needs: [registerArtifactPackage, build]
    if: ${{ needs.build.outputs.lifecycle_stage == 'production' }}
    steps:
      - name: Create Change in ServiceNow (Production)
        id: create_change_prod
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: "Create Change (Production)"
          change-request-type: "normal"
          short-description: "Deploy Finance API ${{ needs.build.outputs.artifact_version }} to Production"
          description: "Deployment of Finance API version ${{ needs.build.outputs.artifact_version }} to Production"
          assignment-group: "DevOps"
          configuration-item: ${{ needs.build.outputs.app_service }}

      - name: Deployment to Production
        env:
          ARTIFACT_VERSION: ${{ needs.build.outputs.artifact_version }}
          APP_SERVICE: ${{ needs.build.outputs.app_service }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Simulating deployment of Finance API version '$ARTIFACT_VERSION' to PRODUCTION"
          echo "Target service: $APP_SERVICE"
          echo "Triggered from branch: $BRANCH"
          echo "Change request created in previous step (see ServiceNow)."

