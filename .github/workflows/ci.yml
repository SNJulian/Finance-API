name: CI

on:
  push:
    branches: [ "develop" ]
  # pull_request:
  #   branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: 'NPM Build'
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      dev_version: ${{ steps.version.outputs.dev_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud likes full history for PR decoration, coverage, etc.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Extract versions
        id: version
        run: |
          SEMVER=$(node -p "require('./package.json').version")
          BUILD=${GITHUB_RUN_NUMBER}
          DEV_VERSION="${SEMVER}-dev.${BUILD}"

          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "dev_version=${DEV_VERSION}" >> $GITHUB_OUTPUT

          echo "Semantic Version: $SEMVER"
          echo "Dev Version: $DEV_VERSION"


  test:
    runs-on: ubuntu-latest
    name: 'Test'
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud likes full history for PR decoration, coverage, etc.
          fetch-depth: 0

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm test -- --coverage
        env:
          NODE_ENV: test

      - name: ServiceNow DevOps Unit Test Results
        uses: ServiceNow/servicenow-devops-test-report@v6.0.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'Test'
          xml-report-filename: reports/junit/jest-results.xml
          test-summary-name: 'TestSummary'


  analyze:
    runs-on: ubuntu-latest
    name: 'SonarQube Analysis'
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud likes full history for PR decoration, coverage, etc.
          fetch-depth: 0

      # SonarCloud analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}

      - name: ServiceNow DevOps Sonar Scan Results
        uses: ServiceNow/servicenow-devops-sonar@v5.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN}}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'SonarQube Analysis'
          sonar-host-url: ${{ secrets.SONAR_URL }}
          sonar-project-key: ${{ secrets.SONAR_PROJECT_KEY }}

      # (optional) fail the build if Quality Gate fails
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          command: qualitygate


  sbom-upload:
    runs-on: ubuntu-latest
    name: 'Upload SBOM to ServiceNow'
    needs: [build, test, analyze]

    steps:
      - name: Upload SBOM to ServiceNow (Dependency Graph)
        id: upload-sbom
        uses: ServiceNow/vulnerability-response@v1.0.0
        with:
          # ServiceNow instance + creds
          snSbomUser: ${{ secrets.SN_SBOM_USER }}
          snSbomPassword: ${{ secrets.SN_SBOM_PASSWORD }}
          snInstanceUrl: ${{ secrets.SN_INSTANCE_URL }}

          # GitHub token with repo + dependency graph access
          ghToken: ${{ secrets.GH_TOKEN }}

          # Identify the repo for dependency graph
          ghAccountOwner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}   # e.g. "Finance-API"

          # Use GitHub dependency graph as SBOM source
          provider: "dependencyGraph"
          ref: ${{ github.ref_name }}

          # Optional metadata
          buildId: ${{ needs.build.outputs.dev_version }}
          lifecycleStage: "pre_production"
          requestedBy: true
          fetchVulnerabilityInfo: true
          fetchPackageInfo: true
          sbomSource: "github-dependency-graph"
          maxStatusPollAttempts: "5"
          statusAttemptInterval: "10000"


  registerArtifact:
    runs-on: ubuntu-latest
    name: 'Register Artifact'
    needs: [build, analyze, sbom-upload]
    steps:
      - name: ServiceNow DevOps Register Artifact
        uses: ServiceNow/servicenow-devops-register-artifact@v5.1.0
        env:
          SEMVER: ${{ needs.build.outputs.semver }}
          DEV_VERSION: ${{ needs.build.outputs.dev_version }}
        with:
          # Devops Integration Token
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          # ServiceNow Instance URL
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          # Orchestration Tool Id
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          # Display Name of the Job
          job-name: 'Register Artifact'
          # Github Context
          context-github: ${{ toJSON(github) }}
          # List of Artifacts to be registered
          artifacts: >-
            [{"name":"com:finance-api",
              "version":"${{ env.DEV_VERSION }}",
              "semanticVersion":"${{ env.DEV_VERSION }}",
              "repositoryName":"${{ github.repository }}"}]
